[workspace]
members = ["backend/app", "backend/engine"]
resolver = "2"

[workspace.package]
description = "24/7 TV playout with a scheduler, an XMLTV guide and a web interface"
readme = "README.md"
version = "1.4.3"
license = "GPL-3.0"
repository = "https://github.com/LuizStSantos/NoAr"
authors = [
    "Luiz Santos <luiz.st.santos@gmail.com>",
    # NoAr is a fork of ffplayout, by:
    "Jonathan Baecker <jonbae77@gmail.com>",
]
edition = "2024"

[profile.release]
debug = false
lto = true
strip = true
opt-level = 3
codegen-units = 1
# Unwind (the default): a panic in one channel's playout is caught by its
# supervisor, which restarts that channel; "abort" would end every channel.

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
semicolon_if_nothing_returned = "warn"
if_not_else = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
redundant_else = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
