# Dedicated loopback-only live input relay for the owned fire-test fixture.
logLevel: info
api: yes
apiAddress: 127.0.0.1:9997
authInternalUsers:
  - user: any
    ips: ['127.0.0.1']
    permissions:
      - action: api
      - action: publish
      - action: read
rtsp: no
webrtc: no
rtmp: yes
rtmpAddress: 127.0.0.1:1935
srt: yes
srtAddress: 127.0.0.1:8890
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 7
hlsSegmentDuration: 1s
paths:
  live/feed:
    source: publisher
