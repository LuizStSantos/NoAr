<!doctype html>
<!-- GitHub social preview (1280x640). Render with: node qa/screenshots/social-preview.cjs
     GitHub crops the card: keep everything that matters inside x 80-1200, y 80-560
     (its repo card template); the script checks it. Only the background may bleed. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>NoAr social preview</title>
        <style>
            @font-face {
                font-family: Plex;
                font-weight: 400;
                src: url(../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2);
            }
            @font-face {
                font-family: Plex;
                font-weight: 500;
                src: url(../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2);
            }
            @font-face {
                font-family: Plex;
                font-weight: 600;
                src: url(../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2);
            }
            @font-face {
                font-family: Plex;
                font-weight: 700;
                src: url(../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-700-normal.woff2);
            }
            @font-face {
                font-family: PlexMono;
                font-weight: 500;
                src: url(../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2);
            }
            :root {
                --bg: #17181a;
                --panel: #1f2023;
                --line: #2c2e33;
                --text: #e8e6e3;
                --muted: #a3a7ad;
                --accent: #f28c1b;
                --live: #ff5c5c;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1280px;
                height: 640px;
                overflow: hidden;
                background: var(--bg);
            }
            body {
                font-family: Plex, sans-serif;
                color: var(--text);
                position: relative;
            }
            .glow {
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(700px 520px at -60px 700px, rgba(242, 140, 27, 0.22), transparent 70%),
                    radial-gradient(600px 400px at 1200px -80px, rgba(242, 140, 27, 0.1), transparent 70%);
            }
            .grid {
                position: absolute;
                inset: 0;
                opacity: 0.35;
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
                background-size: 40px 40px;
                mask-image: linear-gradient(90deg, #000 0, #000 45%, transparent 75%);
            }
            .copy {
                position: absolute;
                left: 96px;
                top: 96px;
                width: 524px;
                display: flex;
                flex-direction: column;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
            }
            .brand svg {
                width: 68px;
                height: 68px;
                filter: drop-shadow(0 10px 30px rgba(242, 140, 27, 0.35));
            }
            .brand h1 {
                margin: 0;
                font-size: 76px;
                line-height: 1;
                font-weight: 700;
                letter-spacing: -0.02em;
            }
            .tag {
                margin: 24px 0 0;
                font-size: 36px;
                line-height: 1.12;
                font-weight: 600;
                letter-spacing: -0.01em;
            }
            .tag em {
                font-style: normal;
                color: var(--accent);
            }
            .desc {
                margin: 14px 0 0;
                font-size: 20px;
                line-height: 1.45;
                color: var(--muted);
                max-width: 500px;
            }
            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 22px;
                max-width: 524px;
            }
            .chip {
                font:
                    500 15px PlexMono,
                    monospace;
                padding: 6px 11px;
                border: 1px solid var(--line);
                border-radius: 999px;
                color: #cfd2d6;
                background: rgba(31, 32, 35, 0.8);
            }
            .chip.hot {
                border-color: rgba(242, 140, 27, 0.55);
                color: var(--accent);
                background: rgba(242, 140, 27, 0.08);
            }
            .foot {
                position: absolute;
                left: 96px;
                bottom: 100px;
                font:
                    500 16px PlexMono,
                    monospace;
                color: #7d8187;
                display: flex;
                gap: 26px;
            }
            .foot b {
                color: #cfd2d6;
                font-weight: 500;
            }
            .shot {
                position: absolute;
                left: 652px;
                top: 177px;
                width: 532px;
                height: 285.6px;
                border-radius: 14px;
                overflow: hidden;
                border: 1px solid #34373d;
                box-shadow:
                    0 30px 80px rgba(0, 0, 0, 0.6),
                    0 0 0 8px rgba(255, 255, 255, 0.02);
            }
            /* docs/images/player.png (1440x1000) cropped to x 20-1406, y 72-816. */
            .shot img {
                position: absolute;
                display: block;
                width: 552.7px;
                left: -7.7px;
                top: -27.6px;
            }

            .onair {
                position: absolute;
                left: 636px;
                top: 155px;
                z-index: 2;
                display: flex;
                align-items: center;
                gap: 8px;
                font:
                    600 15px Plex,
                    sans-serif;
                letter-spacing: 0.08em;
                color: #fff;
                background: var(--live);
                padding: 7px 13px;
                border-radius: 7px;
                box-shadow: 0 8px 24px rgba(255, 92, 92, 0.35);
            }
            .onair i {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #fff;
            }
        </style>
    </head>
    <body>
        <div class="glow"></div>
        <div class="grid"></div>
        <div class="copy">
            <div class="brand">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <rect width="64" height="64" rx="14" fill="#f28c1b" />
                    <path d="M24 18v28l22-14z" fill="#1c1c1c" />
                    <circle cx="48" cy="16" r="5" fill="#1c1c1c" />
                </svg>
                <h1>NoAr</h1>
            </div>
            <p class="tag">24/7 TV playout,<br /><em>run from the browser</em></p>
            <p class="desc">
                Daily playlists, scheduled lives, live graphics and an XMLTV guide, without dropping the air.
            </p>
            <div class="chips">
                <span class="chip hot">HLS · SRT · RTMP · UDP</span><span class="chip">NDI</span
                ><span class="chip">SDI / HDMI</span> <span class="chip hot">SCTE-35</span
                ><span class="chip">Composer graphics</span><span class="chip">XMLTV</span>
            </div>
        </div>
        <div class="foot">
            <span><b>Rust</b> · GStreamer · Vue · Docker</span><span>GPL-3.0</span>
        </div>
        <div class="onair"><i></i>ON AIR</div>
        <div class="shot"><img src="../../docs/images/player.png" alt="" /></div>
    </body>
</html>
