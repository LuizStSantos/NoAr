[package]
name = "ffplayout"
description.workspace = true
readme.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# The Docker image builds the server only; the desktop window is optional.
default = ["embed_frontend"]
desktop-base = []
desktop = ["desktop-base", "ff-engine/desktop"]
desktop-cpu = ["desktop-base", "ff-engine/desktop-cpu"]
embed_frontend = []
dev-metrics = ["dep:console-subscriber", "dep:tracing-subscriber", "tokio/tracing"]
processing-bench = ["ff-engine/processing-bench"]
ffmpeg-filter = ["ff-engine/ffmpeg-filter"]
ffmpeg-device = ["ff-engine/ffmpeg-device"]

[dependencies]
ff-engine = { path = "../engine", default-features = false, features = [
    "tokio",
] }

axum = { version = "0.8", default-features = false, features = [
    "form",
    "http1",
    "json",
    "matched-path",
    "multipart",
    "macros",
    "original-uri",
    "query",
    "tokio",
    "tracing",
] }
argon2 = "0.6"
async-walkdir = "2"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.3", features = ["derive", "env"] }
console-subscriber = { version = "0.5", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
derive_more = { version = "2", features = ["display"] }
faccess = "0.2"
flexi_logger = { version = "0.31", features = ["async", "colors", "kv"] }
iana-time-zone = "0.1"
include_dir = "0.7"
inquire = "0.9"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
lazy-limit = "1"
lettre = { version = "0.11", features = [
    "builder",
    "rustls-tls",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
], default-features = false }
lexical-sort = "0.3"
local-ip-address = "0.6"
log = { version = "0.4", features = ["std", "kv"] }
mime_guess = "2"
nix = { version = "0.31", features = ["user", "fs"] }
notify = "8.0"
notify-debouncer-full = { version = "*", default-features = false }
path-clean = "1.0"
quick-xml = "0.41"
protect-axum = "0.2"
rand = "0.10"
real = { version = "0.1", features = ["axum"] }
regex = "1"
relative-path = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sanitize-filename = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.39", default-features = false, features = [
    "disk",
    "network",
    "system",
    "linux-netdevs",
    "linux-tmpfs",
] }
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
tokio = { version = "1.44", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml_edit = { version = "0.25", features = ["serde"] }
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
serial_test = "4.0"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
build-print = "1"

[[bin]]
name = "noar"
path = "src/main.rs"
