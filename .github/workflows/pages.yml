name: Website

# Publish site/ (the page, its fonts and the README screenshots it shows) to
# GitHub Pages at https://luizstsantos.github.io/NoAr/. Pages must use
# "GitHub Actions" as its source (Settings › Pages). See site/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the website
        run: sh site/build.sh "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
