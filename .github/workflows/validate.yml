name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:
  # Docker image and Release run this first and publish only when it passes.
  workflow_call:
  # Prepare release starts it on the release branch: a push made with
  # GITHUB_TOKEN starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NoAr runs in Docker on Linux, so this checks the same build the image uses.
  build:
    runs-on: ubuntu-24.04
    # Match the image's toolchain and native GStreamer 1.26 / codec packages.
    container: rust:1.99.1-trixie

    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2

    steps:
      - name: Install native media build and runtime dependencies
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends \
            clang \
            cmake \
            curl \
            ffmpeg \
            fonts-dejavu-core \
            g++ \
            glib-networking \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libgnutls28-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libswresample-dev \
            libswscale-dev \
            make \
            pkg-config
          ffmpeg -version
          test "$(pkg-config --modversion libavformat | cut -d. -f1)" -ge 61
          for library in gstreamer-1.0 gstreamer-app-1.0 gstreamer-audio-1.0 \
            gstreamer-video-1.0 gstreamer-pbutils-1.0 gstreamer-mpegts-1.0; do
            pkg-config --atleast-version=1.26 "$library"
            pkg-config --modversion "$library"
          done

      - uses: actions/checkout@v6
      - name: Build and test the corrected SRT lifecycle
        run: |
          sh docker/srt/build.sh /usr/local
          ldconfig
          cc -Wall -Wextra -Werror docker/srt/test-lifecycle.c \
            -I/usr/local/include -L/usr/local/lib \
            -Wl,-rpath,/usr/local/lib -lsrt-gnutls -o /tmp/test-srt-lifecycle
          timeout 30 /tmp/test-srt-lifecycle

      - name: Verify required native GStreamer plugins
        run: |
          set -eu
          for factory in appsrc appsink uridecodebin videoconvert videoscale videorate \
            audioconvert audioresample x264enc avenc_aac h264parse aacparse \
            mpegtsmux tsdemux srtsrc srtsink rtmp2src rtmp2sink flvmux \
            qtdemux qtmux matroskamux splitmuxsink; do
            gst-inspect-1.0 "$factory" >/dev/null
          done

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set build tools for the pinned Rust toolchain
        run: |
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Frontend checks
        run: |
          npm ci
          npm run build
          npx eslint --config frontend/eslint.config.ts frontend/src

      - name: Rust tests and lint
        run: |
          # Failing tests, lints and compiler errors also show up as
          # annotations on the run summary, so they can be read without the
          # full log.
          set -o pipefail

          check() {
            local name=$1
            shift

            if ! "$@" 2>&1 | tee step.log; then
              grep -E "^---- |panicked at|^(error|warning)(\[|:)| --> |^test .* FAILED|^Diff in" step.log \
                | head -60 \
                | sed "s/^/::error title=$name::/"
              exit 1
            fi
          }

          check "cargo test" cargo test --no-default-features
          check "cargo clippy" cargo clippy --no-default-features --all-targets -- --deny warnings
          check "cargo fmt" cargo fmt --all -- --check
          check "cargo build" cargo build --no-default-features --features embed_frontend
