name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NoAr runs in Docker on Linux, so this checks the same build the image uses.
  build:
    # The FFmpeg 7 PPA below is built for Ubuntu 24.04; ubuntu-latest moves to
    # 26.04 from October 2026, where the PPA does not install.
    runs-on: ubuntu-24.04

    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set Build Tools and update Rust
        run: |
          rustup update stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            pkg-config
          ffmpeg -version
          test "$(pkg-config --modversion libavformat | cut -d. -f1)" -ge 61

      - name: Frontend checks
        run: |
          npm ci
          npm run build
          npx eslint --config frontend/eslint.config.ts frontend/src

      - name: Rust tests and lint
        run: |
          # Failing tests, lints and compiler errors also show up as
          # annotations on the run summary, so they can be read without the
          # full log.
          set -o pipefail

          check() {
            local name=$1
            shift

            if ! "$@" 2>&1 | tee step.log; then
              grep -E "^---- |panicked at|^(error|warning)(\[|:)| --> |^test .* FAILED|^Diff in" step.log \
                | head -60 \
                | sed "s/^/::error title=$name::/"
              exit 1
            fi
          }

          check "cargo test" cargo test --no-default-features
          check "cargo clippy" cargo clippy --no-default-features --all-targets -- --deny warnings
          check "cargo fmt" cargo fmt --all -- --check
          check "cargo build" cargo build --no-default-features --features embed_frontend
