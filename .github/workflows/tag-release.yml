name: Tag release

# When a release pull request is merged, the version in Cargo.toml changes on
# main: tag it and start the release and image workflows for the tag. A tag
# pushed with GITHUB_TOKEN starts no workflow by itself, so they are started
# here.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the new version
        id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag exists already; nothing to release"
            exit 0
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no section for $version; not releasing it"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "NoAr $version"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the release and the image
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          gh workflow run docker.yml --ref "$TAG"
