name: Prepare release

# Opens the pull request "Release X.Y.Z": the next version worked out from the
# Unreleased notes (see docs/releasing.md), the changelog dated and the version
# set everywhere. Merging it tags and publishes the release (tag-release.yml).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which number goes up (auto reads the Unreleased notes)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      pre:
        description: Release candidate suffix, such as rc.1 (optional)
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags tell which migrations are new since the last release.
          fetch-depth: 0

      - name: Work out the version and date the changelog
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          PRE: ${{ inputs.pre }}
        run: |
          args=(--bump "$BUMP")
          if [ -n "$PRE" ]; then
            if ! [[ "$PRE" =~ ^[0-9A-Za-z.-]+$ ]]; then
              echo "::error::Invalid release candidate suffix: $PRE"
              exit 1
            fi
            args+=(--pre "$PRE")
          fi

          python3 .claude/scripts/prepare_release.py "${args[@]}" > plan.json
          cat plan.json
          version=$(jq -r .next plan.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "reasons<<EOF"
            jq -r '.reasons[] | "- " + .' plan.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm plan.json

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          REASONS: ${{ steps.plan.outputs.reasons }}
        run: |
          branch="release/v$VERSION"

          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::Branch $branch already exists; close its pull request first"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Release $VERSION"
          git push origin "$branch"

          awk -v version="$VERSION" '
            /^## \[/ { found = index($0, "## [" version "]") == 1; next }
            /^\[[^]]+\]: / { found = 0 }
            found { print }
          ' CHANGELOG.md > notes.md

          {
            echo "Release **$VERSION**, prepared from the Unreleased notes."
            echo
            echo "Why this number:"
            echo "$REASONS"
            echo
            echo "Merging this tags \`v$VERSION\`, publishes the image and creates the GitHub release."
            echo "Check the notes below and the CI before merging."
            echo
            echo "---"
            cat notes.md
          } > body.md

          gh pr create --base main --head "$branch" --title "Release $VERSION" --body-file body.md
          gh workflow run validate.yml --ref "$branch"
