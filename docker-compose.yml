# NoAr: 24/7 playout with scheduler and XMLTV guide.
#
#   docker compose pull && docker compose up -d --no-build
#                                 # start or update with the published image
#   docker compose logs -f        # follow the logs
#   docker compose build          # only to compile from the source instead
#
# Then open http://<server>:8787 and complete the setup page.

services:
  noar:
    image: ghcr.io/luizstsantos/noar:latest
    build: .
    container_name: noar
    restart: unless-stopped
    labels:
      # The updater may replace this container with a newer image.
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      # Time zone used for playlists, schedules and the guide.
      TZ: America/Sao_Paulo
      # Lets Settings › Updates install a new version through noar-updater.
      NOAR_UPDATER_URL: http://noar-updater:8080
      NOAR_UPDATER_TOKEN: ${NOAR_UPDATER_TOKEN:-}
      # Behind a reverse proxy, only its address may say who the client is
      # (see docs/docker.md, "Behind a reverse proxy").
      # NOAR_TRUSTED_PROXIES: 172.17.0.1
      # NVIDIA encoding (see docs/docker.md): with the deploy block below.
      # NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    # The NVIDIA card, for the NVENC encoders (needs the NVIDIA Container Toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    volumes:
      # Media, playlists, database, HLS output and logs.
      - ./data:/data
      # DeckLink cards (see docs/video-cards.md): the Desktop Video API.
      # - /usr/lib/libDeckLinkAPI.so:/usr/lib/libDeckLinkAPI.so:ro
    # Video cards (see docs/video-cards.md).
    # devices:
    #   - /dev/blackmagic:/dev/blackmagic
    #   - /dev/video0:/dev/video0
    #   - /dev/snd:/dev/snd
    # NDI: run `sudo sh docker/ndi/enable-ndi.sh` (see docs/ndi.md); it
    # writes docker-compose.override.yml instead of changing this file.
    ports:
      # Web interface, API, HLS and XMLTV guide.
      - "8787:8787"

  # Pulls a newer NoAr image and restarts NoAr with it when Settings ›
  # Updates asks. Only it talks to Docker; NoAr gets no access to the server.
  # Turn it on once, in the folder of this file:
  #
  #   echo "COMPOSE_PROFILES=updater" >> .env
  #   echo "NOAR_UPDATER_TOKEN=$(openssl rand -hex 24)" >> .env
  #   docker compose up -d
  noar-updater:
    image: nickfedor/watchtower
    container_name: noar-updater
    restart: unless-stopped
    profiles: [updater]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # A private image needs the login of `docker login ghcr.io`:
      # - ~/.docker/config.json:/config.json:ro
    environment:
      TZ: America/Sao_Paulo
      # Only on request: no updates on its own schedule.
      WATCHTOWER_HTTP_API_ENDPOINTS: update,health
      WATCHTOWER_HTTP_API_TOKEN: ${NOAR_UPDATER_TOKEN:-}
      # Only containers labelled for it, here NoAr.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove the old image after an update.
      WATCHTOWER_CLEANUP: "true"
